# nginx для Lys Montage на Hetzner.
# Копія: /etc/nginx/sites-available/lys-montage → symlink у sites-enabled.
#
# Цей файл ставить лише bootstrap.sh і лише якщо його ще немає на сервері:
# після `certbot --nginx` сюди дописуються рядки сертифіката й редирект на HTTPS,
# і деплой не повинен їх стирати. Усі правила сайту — у snippets/lys-montage-site.conf
# (deploy/nginx-lys-montage-site.conf), який оновлюється при кожному деплої.

server {
    listen 80;
    listen [::]:80;
    server_name lysmontage.com www.lysmontage.com;

    include snippets/lys-montage-site.conf;
}
