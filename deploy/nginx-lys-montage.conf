# nginx для Lys Montage на Hetzner.
# Копія: /etc/nginx/sites-available/lys-montage → symlink у sites-enabled.
#
# Статика віддається прямо з git-клону (/srv/lys-montage/repo), а згенерований
# Instagram-контент — з /srv/lys-montage/data, який у git не потрапляє.
# Перед увімкненням HTTPS підміни example.com на справжній домен і виконай certbot.

server {
    listen 80;
    listen [::]:80;
    server_name lysmontage.com www.lysmontage.com;

    root /srv/lys-montage/repo;
    index index.html;

    access_log /var/log/nginx/lys-montage.access.log;
    error_log  /var/log/nginx/lys-montage.error.log;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Згенерований Instagram-фід -----------------------------------------
    # Фід мусить читатися свіжим: інакше браузер тримав би добову копію
    # і новий пост з'являвся б із запізненням навіть після успішного синку.
    location = /assets/data/instagram.json {
        alias /srv/lys-montage/data/instagram.json;
        add_header Cache-Control "no-cache" always;
        types { } default_type application/json;
    }

    # Файли названі за id публікації й ніколи не змінюють вміст — кешуємо надовго.
    location /assets/instagram/ {
        alias /srv/lys-montage/data/instagram/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # --- Статика сайту -------------------------------------------------------
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location ~* \.(?:jpg|jpeg|png|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
    }

    # Службові каталоги репозиторію назовні не віддаємо.
    location ~ ^/(?:\.git|tools|deploy|specs|\.specify|\.agents)(?:/|$) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
