# Правила сайту Lys Montage — підключаються всередині server-блоку
# з nginx-lys-montage.conf. deploy.sh перезаписує цей файл при кожному деплої,
# а сам server-блок (де certbot тримає сертифікат) не чіпає.
#
# Статика віддається прямо з git-клону (/srv/lys-montage/repo), а згенерований
# Instagram-контент — з /srv/lys-montage/data, який у git не потрапляє.

root /srv/lys-montage/repo;
index index.html;

access_log /var/log/nginx/lys-montage.access.log;
error_log  /var/log/nginx/lys-montage.error.log;

charset utf-8;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/ld+json text/plain application/xml;
gzip_min_length 512;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Одна канонічна адреса: www → без www. Перевірки certbot (acme-challenge)
# не переадресовуємо, інакше сертифікат для www не випуститься.
set $www_redirect 0;
if ($host = www.lysmontage.com) {
    set $www_redirect 1;
}
if ($request_uri ~ ^/\.well-known/acme-challenge/) {
    set $www_redirect 0;
}
if ($www_redirect) {
    return 301 $scheme://lysmontage.com$request_uri;
}

# --- Згенерований Instagram-фід -----------------------------------------
# Фід мусить читатися свіжим: інакше браузер тримав би добову копію
# і новий пост з'являвся б із запізненням навіть після успішного синку.
location = /assets/data/instagram.json {
    alias /srv/lys-montage/data/instagram.json;
    add_header Cache-Control "no-cache" always;
    types { } default_type application/json;
}

# Файли названі за id публікації й ніколи не змінюють вміст — кешуємо надовго.
location /assets/instagram/ {
    alias /srv/lys-montage/data/instagram/;
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    access_log off;
}

# --- Службові файли репозиторію назовні не віддаємо ----------------------
# Стоїть перед правилами статики: regex-локації перевіряються по черзі.
location ~ ^/(?:\.git|docs|tools|deploy|specs|\.specify|\.agents|\.claude)(?:/|$) {
    return 404;
}

location ~ /\. {
    return 404;
}

location ~* \.md$ {
    return 404;
}

location = /lys_montage.png {
    return 404;
}

# --- Статика сайту -------------------------------------------------------
location ~* \.(?:css|js)$ {
    expires 7d;
    add_header Cache-Control "public" always;
}

location ~* \.(?:jpg|jpeg|png|svg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    access_log off;
}

location = / {
    add_header Cache-Control "no-cache" always;
}

location / {
    try_files $uri $uri/ =404;
}
